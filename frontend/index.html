<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <!-- <link rel="manifest" href="./manifest.json" /> -->
    <link rel="apple-touch-icon" href="../ui/icons/icon-192.png" />
    <title>Журнал регистрации заявок</title>
    <script>
      // Anti-FOUC: применяем сохранённую тему до первой отрисовки страницы.
      // Модуль theme-controller.js отработает позже (на DOMContentLoaded), поэтому
      // без этого скрипта при F5 в тёмной теме мелькал светлый фон.
      (function () {
        try {
          var savedTheme = localStorage.getItem("theme") || "light";
          document.documentElement.setAttribute("data-theme", savedTheme);
        } catch (e) {
          // Приватный режим или отключённый localStorage — молча падаем на светлую
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Навбар верхнего меню -->
    <nav class="navbar">
      <div style="display: flex; align-items: center; gap: 30px">
        <!-- Новый логотип с иконкой -->
        <div
          class="nav-logo"
          style="cursor: pointer; display: flex; align-items: center; gap: 12px"
          id="navLogo"
        >
          <svg
            class="logo-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 512 512"
            width="40"
            height="40"
          >
            <defs>
              <linearGradient
                id="shieldGrad"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%"
              >
                <stop
                  offset="0%"
                  style="stop-color: #4a6a8a; stop-opacity: 1"
                />
                <stop
                  offset="50%"
                  style="stop-color: #3a5a7a; stop-opacity: 1"
                />
                <stop
                  offset="100%"
                  style="stop-color: #2a4a6a; stop-opacity: 1"
                />
              </linearGradient>
              <radialGradient id="shieldHighlight" cx="30%" cy="30%">
                <stop
                  offset="0%"
                  style="stop-color: #6a8aaa; stop-opacity: 0.6"
                />
                <stop
                  offset="100%"
                  style="stop-color: #3a5a7a; stop-opacity: 0"
                />
              </radialGradient>
            </defs>

            <path
              d="M256 30 L460 100 L460 280 Q460 420 256 490 Q52 420 52 280 L52 100 Z"
              fill="url(#shieldGrad)"
              stroke="currentColor"
              stroke-width="8"
            />
            <path
              d="M256 30 L460 100 L460 280 Q460 420 256 490 Q52 420 52 280 L52 100 Z"
              fill="url(#shieldHighlight)"
            />

            <g transform="translate(256, 240)">
              <g fill="#c0c8d0" opacity="0.85">
                <rect x="-18" y="-130" width="36" height="30" rx="4" />
                <rect
                  x="-18"
                  y="-130"
                  width="36"
                  height="30"
                  rx="4"
                  transform="rotate(30)"
                />
                <rect
                  x="-18"
                  y="-130"
                  width="36"
                  height="30"
                  rx="4"
                  transform="rotate(60)"
                />
                <rect
                  x="-18"
                  y="-130"
                  width="36"
                  height="30"
                  rx="4"
                  transform="rotate(90)"
                />
                <rect
                  x="-18"
                  y="-130"
                  width="36"
                  height="30"
                  rx="4"
                  transform="rotate(120)"
                />
                <rect
                  x="-18"
                  y="-130"
                  width="36"
                  height="30"
                  rx="4"
                  transform="rotate(150)"
                />
                <rect
                  x="-18"
                  y="-130"
                  width="36"
                  height="30"
                  rx="4"
                  transform="rotate(180)"
                />
                <rect
                  x="-18"
                  y="-130"
                  width="36"
                  height="30"
                  rx="4"
                  transform="rotate(210)"
                />
                <rect
                  x="-18"
                  y="-130"
                  width="36"
                  height="30"
                  rx="4"
                  transform="rotate(240)"
                />
                <rect
                  x="-18"
                  y="-130"
                  width="36"
                  height="30"
                  rx="4"
                  transform="rotate(270)"
                />
                <rect
                  x="-18"
                  y="-130"
                  width="36"
                  height="30"
                  rx="4"
                  transform="rotate(300)"
                />
                <rect
                  x="-18"
                  y="-130"
                  width="36"
                  height="30"
                  rx="4"
                  transform="rotate(330)"
                />
              </g>
              <circle cx="0" cy="0" r="110" fill="#c0c8d0" opacity="0.85" />
              <circle cx="0" cy="0" r="80" fill="url(#shieldGrad)" />
            </g>

            <g fill="#2a4a6a">
              <rect x="200" y="280" width="112" height="130" rx="4" />
              <rect x="220" y="100" width="72" height="200" rx="2" />
              <g fill="#4a6a8a">
                <rect x="232" y="115" width="16" height="16" rx="2" />
                <rect x="264" y="115" width="16" height="16" rx="2" />
                <rect x="232" y="145" width="16" height="16" rx="2" />
                <rect x="264" y="145" width="16" height="16" rx="2" />
                <rect x="232" y="175" width="16" height="16" rx="2" />
                <rect x="264" y="175" width="16" height="16" rx="2" />
                <rect x="232" y="205" width="16" height="16" rx="2" />
                <rect x="264" y="205" width="16" height="16" rx="2" />
                <rect x="232" y="235" width="16" height="16" rx="2" />
                <rect x="264" y="235" width="16" height="16" rx="2" />
              </g>
              <rect
                x="240"
                y="360"
                width="32"
                height="50"
                rx="4"
                fill="#1a3a5a"
              />
            </g>

            <path
              d="M160 380 L230 450 L370 310"
              fill="none"
              stroke="currentColor"
              stroke-width="28"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>

          <div class="logo-text-group">
            <div class="logo-title">LIFT</div>
            <div class="logo-subtitle">Control System</div>
            <div class="logo-tenant" id="navTenantName">
              ООО "Рога и копыта"
            </div>
          </div>
        </div>

        <div id="dynamicMenu" class="spa-nav-menu"></div>
      </div>
      <div
        style="
          display: flex;
          gap: 15px;
          align-items: center;
          position: relative;
        "
      >
        <!-- Индикатор очереди синхронизации -->
        <button
          id="syncIndicator"
          class="sync-indicator sync-idle"
          type="button"
          title="Всё синхронизировано"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path
              d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"
            />
          </svg>
          <span class="sync-indicator-badge" style="display: none">0</span>
        </button>

        <!-- Блок профиля пользователя (скрыт по умолчанию) -->
        <div
          class="user-profile-wrapper"
          id="userProfileWrapper"
          style="display: none"
        >
          <button class="user-profile-btn" id="userProfileBtn">
            <!-- Аватарка (пока буква, но легко заменить на <img>) -->
            <div class="user-avatar" id="navUserAvatar">А</div>
            <span class="user-name" id="navUserName">Имя</span>
            <svg
              class="user-arrow"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="currentColor"
            >
              <path d="M7 10l5 5 5-5z" />
            </svg>
          </button>

          <!-- Выпадающее меню -->
          <div class="user-dropdown" id="userDropdown">
            <a href="#/profile" class="dropdown-item">
              <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="currentColor"
              >
                <path
                  d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                />
              </svg>
              Личный кабинет
            </a>
            <hr class="dropdown-divider" />
            <button class="dropdown-item dropdown-item-danger" id="logoutBtn">
              <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="currentColor"
              >
                <path
                  d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"
                />
              </svg>
              Выход
            </button>
          </div>
        </div>

        <!-- Кнопка темы -->
        <button id="themeToggle" class="theme-toggle-btn">
          <svg class="sun-icon" viewBox="0 0 24 24">
            <path
              d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41zM5.99 18.01l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41z"
            />
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24">
            <path
              d="M12.3 22h-.1c-5.5 0-10-4.5-10-10 0-4.8 3.5-8.9 8.2-9.8.6-.1 1.2.3 1.3.9.1.6-.2 1.2-.8 1.4-3.1 1.2-5.1 4.2-5.1 7.5 0 4.4 3.6 8 8 8 3.3 0 6.3-2 7.5-5.1.2-.6.8-.9 1.4-.8.6.1 1 .7.9 1.3-.9 4.7-5 8.2-9.8 8.2z"
            />
          </svg>
        </button>
      </div>
    </nav>
    <!-- Плашка «Вы офлайн / есть несинхронизированные действия» -->
    <div id="offlineBanner" class="offline-banner" style="display: none">
      <span class="offline-banner-text"></span>
      <button class="offline-banner-btn" type="button">Синхронизировать</button>
    </div>

    <!-- Единый главный флекс-контейнер для разметки SPA и Подвала -->
    <div class="container">
      <!-- Сюда роутер монтирует таблицы или формы -->
      <main
        id="app"
        style="
          flex: 1;
          display: flex;
          flex-direction: column;
          min-height: 0;
          width: 100%;
          overflow: hidden;
        "
      ></main>

      <!-- БЛОК ИСТОРИИ -->
      <div class="history-wrapper" id="historyWrapper" style="display: none">
        <div class="history-title" id="historyTitle">
          История
          <button
            id="historyToggleBtn"
            class="history-toggle-btn"
            title="Свернуть/Развернуть историю"
          >
            <svg
              class="history-arrow"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="currentColor"
            >
              <path d="M7 14l5-5 5 5z" />
              <!-- Стрелочка вверх -->
            </svg>
          </button>
        </div>

        <div class="history-list-container">
          <div class="history-item">
            Автономный модуль SPA развернут успешно.
          </div>
        </div>

        <div
          id="apiStatusBlock"
          class="api-status-field"
          style="display: none"
        ></div>
        <div
          id="inactivityStatusBlock"
          class="api-status-field"
          style="display: flex; justify-content: flex-end"
        >
          <span>До автовозврата: <b id="inactivityCountdown">30:00</b></span>
        </div>
      </div>
    </div>
    <div
      id="networkLedIndicator"
      class="network-led"
      title="Статус сетевого шлюза"
    ></div>
    <div id="toastContainer" aria-live="polite"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
