<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:creator>RealFaviconGenerator</dc:creator><dc:source>https://realfavicongenerator.net</dc:source></rdf:Description></rdf:RDF></metadata><defs>
    <!-- Градиент щита -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a6a8a;stop-opacity:1"></stop>
      <stop offset="50%" style="stop-color:#3a5a7a;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#2a4a6a;stop-opacity:1"></stop>
    </linearGradient>
    <!-- Градиент для объёма -->
    <radialGradient id="shieldHighlight" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#6a8aaa;stop-opacity:0.6"></stop>
      <stop offset="100%" style="stop-color:#3a5a7a;stop-opacity:0"></stop>
    </radialGradient>
  </defs><path d="M256 30 L460 100 L460 280 Q460 420 256 490 Q52 420 52 280 L52 100 Z" fill="url(#shieldGrad)" stroke="white" stroke-width="8"></path><path d="M256 30 L460 100 L460 280 Q460 420 256 490 Q52 420 52 280 L52 100 Z" fill="url(#shieldHighlight)"></path><g transform="translate(256, 240)">
    <!-- Зубья шестерёнки -->
    <g fill="#c0c8d0" opacity="0.85">
      <rect x="-18" y="-130" width="36" height="30" rx="4"></rect>
      <rect x="-18" y="-130" width="36" height="30" rx="4" transform="rotate(30)"></rect>
      <rect x="-18" y="-130" width="36" height="30" rx="4" transform="rotate(60)"></rect>
      <rect x="-18" y="-130" width="36" height="30" rx="4" transform="rotate(90)"></rect>
      <rect x="-18" y="-130" width="36" height="30" rx="4" transform="rotate(120)"></rect>
      <rect x="-18" y="-130" width="36" height="30" rx="4" transform="rotate(150)"></rect>
      <rect x="-18" y="-130" width="36" height="30" rx="4" transform="rotate(180)"></rect>
      <rect x="-18" y="-130" width="36" height="30" rx="4" transform="rotate(210)"></rect>
      <rect x="-18" y="-130" width="36" height="30" rx="4" transform="rotate(240)"></rect>
      <rect x="-18" y="-130" width="36" height="30" rx="4" transform="rotate(270)"></rect>
      <rect x="-18" y="-130" width="36" height="30" rx="4" transform="rotate(300)"></rect>
      <rect x="-18" y="-130" width="36" height="30" rx="4" transform="rotate(330)"></rect>
    </g>
    <!-- Тело шестерёнки -->
    <circle cx="0" cy="0" r="110" fill="#c0c8d0" opacity="0.85"></circle>
    <!-- Внутренний круг (вырез) -->
    <circle cx="0" cy="0" r="80" fill="url(#shieldGrad)"></circle>
  </g><g fill="#2a4a6a">
    <!-- Основание здания -->
    <rect x="200" y="280" width="112" height="130" rx="4"></rect>
    <!-- Башня -->
    <rect x="220" y="100" width="72" height="200" rx="2"></rect>
    <!-- Окна башни -->
    <g fill="#4a6a8a">
      <rect x="232" y="115" width="16" height="16" rx="2"></rect>
      <rect x="264" y="115" width="16" height="16" rx="2"></rect>
      <rect x="232" y="145" width="16" height="16" rx="2"></rect>
      <rect x="264" y="145" width="16" height="16" rx="2"></rect>
      <rect x="232" y="175" width="16" height="16" rx="2"></rect>
      <rect x="264" y="175" width="16" height="16" rx="2"></rect>
      <rect x="232" y="205" width="16" height="16" rx="2"></rect>
      <rect x="264" y="205" width="16" height="16" rx="2"></rect>
      <rect x="232" y="235" width="16" height="16" rx="2"></rect>
      <rect x="264" y="235" width="16" height="16" rx="2"></rect>
    </g>
    <!-- Дверь -->
    <rect x="240" y="360" width="32" height="50" rx="4" fill="#1a3a5a"></rect>
  </g><path d="M160 380 L230 450 L370 310" fill="none" stroke="white" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"></path></svg>